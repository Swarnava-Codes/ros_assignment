amcl:
  ros__parameters:
    use_sim_time: true

    # Coordinate frames
    global_frame_id: map
    odom_frame_id: odom
    base_frame_id: base_footprint
    tf_broadcast: true

    # Laser scan
    scan_topic: /scan
    laser_model_type: likelihood_field
    max_beams: 60
    laser_min_range: 0.1
    laser_max_range: 7.5

    # Motion model
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2

    # Particle filter
    min_particles: 800
    max_particles: 2500
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_slow: 0.001
    recovery_alpha_fast: 0.1

    # Initial pose is supplied through RViz
    set_initial_pose: true
    initial_pose:
     x: 0.0
     y: 5.0
     z: 0.0
     yaw: 0.0

    # Update thresholds
    update_min_d: 0.1
    update_min_a: 0.2
    transform_tolerance: 0.5
